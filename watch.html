<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Просмотр видео — CubeTube</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root {
    --primary-bg: #101116;
    --secondary-bg: #0d0d11;
    --accent-color: #6d6fff;
    --text-color: #c9d1d9;
    --search-bg: #111418;
    --border-color: #30363d;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background-color: var(--primary-bg); color: var(--text-color); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; line-height:1.6;}
header { background-color: var(--secondary-bg); padding:15px 80px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); position:sticky; top:0; z-index:100;}
.logo { font-size:28px; font-weight:700; color: var(--text-color); cursor:pointer; }
.search-container { position: relative; width:400px; }
.search-input { width:100%; padding:10px 45px 10px 15px; border-radius:20px; background-color: var(--search-bg); border:1px solid var(--border-color); color: var(--text-color); font-size:16px; outline:none; }
.search-icon { position:absolute; right:15px; top:50%; transform:translateY(-50%); opacity:0.7;}
.avatar { width:50px; height:50px; border-radius:1%; overflow:hidden; }
.avatar img { width:100%; height:100%; object-fit:cover; }

/* --- Layout страницы --- */
.video-page { display:flex; gap:40px; padding:40px 80px; flex-wrap:wrap; }
.video-player { flex:2.5; min-width:300px; }
.sidebar { flex:1.2; display:flex; flex-direction:column; gap:20px; min-width:250px; }

/* --- Кастомный плеер --- */
.player-container { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; user-select:none; }
video { width:100%; display:block; background:#000; }
.controls { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.5); padding:10px; display:flex; flex-direction:column; opacity:1; transition:opacity 0.3s;}
.controls:hover, .controls.show { opacity:1; }
.progress-container { width:100%; height:6px; background:rgba(255,255,255,0.2); cursor:pointer; border-radius:3px; margin-bottom:8px; }
.progress { width:0%; height:100%; background:var(--accent-color); border-radius:3px; }

.control-buttons { display:flex; align-items:center; justify-content:space-between; }
.left-controls { display:flex; align-items:center; gap:10px; }
.right-controls { display:flex; align-items:center; gap:10px; }

.control-btn { background:none; border:none; color:#fff; cursor:pointer; font-size:16px; }
.volume-container { position:relative; display:flex; align-items:center; cursor:pointer; }
.volume-slider { position:absolute; bottom:35px; left:50%; transform:translateX(-50%) rotate(-90deg); width:100px; display:none; }
.volume-container.active .volume-slider { display:block; }

.speed-container { position:relative; cursor:pointer; }
.speed-options { position:absolute; bottom:35px; right:0; background:var(--secondary-bg); padding:5px 10px; border-radius:6px; display:none; flex-direction:column; }
.speed-container.active .speed-options { display:flex; }
.speed-options div { padding:5px; cursor:pointer; }
.speed-options div:hover { background:var(--accent-color); color:#fff; }

/* --- Видео информация --- */
.video-title { font-size:26px; font-weight:700; margin:15px 0 5px; color:#fff; }
.video-info { opacity:0.8; margin-bottom:15px; }
.channel-block { display:flex; align-items:center; gap:15px; padding:15px 0; border-top:1px solid var(--border-color); border-bottom:1px solid var(--border-color); }
.channel-avatar { width:55px; height:55px; border-radius:50%; overflow:hidden; }
.channel-avatar img { width:100%; height:100%; object-fit:cover; }
.channel-info { display:flex; flex-direction:column; }
.sub-button { background-color: var(--accent-color); border:none; padding:10px 22px; border-radius:20px; cursor:pointer; color:#fff; font-size:15px; font-weight:600; transition:0.2s; }
.sub-button:hover { opacity:0.85; }

/* --- Рекомендации --- */
.rec-card { display:flex; gap:12px; cursor:pointer; }
.rec-thumb { width:160px; height:90px; border-radius:8px; object-fit:cover; }
.rec-info { display:flex; flex-direction:column; }
.rec-title { font-size:15px; font-weight:600; color:#fff; line-height:1.2; }
.rec-meta { font-size:13px; opacity:0.7; }
</style>
</head>
<body>

<header>
    <div class="logo">CubeTube</div>
    <div class="search-container">
        <input class="search-input" type="text" placeholder="Поиск видео...">
        <i class="fas fa-search search-icon"></i>
    </div>
    <div class="avatar"><img src="https://vzge.me/face/1000/urqiui" /></div>
</header>

<div class="video-page">
    <div class="video-player">
        <div class="player-container" id="player">
            <video id="mainVideo" poster="">
                <source src="video.mp4" type="video/mp4">
            </video>
            <div class="controls" id="controls">
                <div class="progress-container" id="progressContainer">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="control-buttons">
                    <div class="left-controls">
                        <button class="control-btn" id="playPause"><i class="fas fa-play"></i></button>
                        <div class="volume-container" id="volumeContainer">
                            <i class="fas fa-volume-up"></i>
                            <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.05">
                        </div>
                    </div>
                    <div class="right-controls">
                        <div class="speed-container" id="speedContainer">
                            <i class="fas fa-forward"></i>
                            <div class="speed-options" id="speedOptions">
                                <div data-speed="0.5">0.5x</div>
                                <div data-speed="1">1x</div>
                                <div data-speed="1.5">1.5x</div>
                                <div data-speed="2">2x</div>
                            </div>
                        </div>
                        <button class="control-btn" id="fullscreen"><i class="fas fa-expand"></i></button>
                        <span id="timeDisplay">0:00 / 0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="video-title" id="videoTitle"></div>
        <div class="video-info" id="videoStats"></div>

        <div class="channel-block">
            <div class="channel-avatar">
                <img src="https://vzge.me/face/1000/urqiui" />
            </div>
            <div class="channel-info">
                <div id="channelName">Канал</div>
                <div id="channelSubs">100K подписчиков</div>
            </div>
            <button class="sub-button">Подписаться</button>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <!-- Рекомендации -->
    </div>
</div>

<script>
// ==== Данные видео ====
const videos = [
    {id:"xl_announce", title:"Анонс Ивента - #XL", author:"@xluniverse / xl universe - официальный канал", stats:"53 просмотров • 1 день назад", thumbnail:"/Frame 1 (17).png", video:"video.mp4"},
    {id:"skinkiselka", title:"Создание скина для Кисельки", author:"@uertyk_ / uertyk_", stats:"2К просмотров • 6 дней назад", thumbnail:"/Frame 1 (16).png", video:"video.mp4"},
    {id:"urli_first_steps", title:"Первые шаги - Юрли!", author:"@urliui / Юрли!", stats:"16 просмотров • 1 день назад", thumbnail:"/Frame 1 (15).png", video:"video.mp4"},
    {id:"unicorn_concert", title:"Концерт с UNICORNX", author:"@unicornx / Косточка Юника", stats:"524К просмотров • 1 год назад", thumbnail:"/Frame 1 (14).png", video:"video.mp4"},
    {id:"xl_emptydreams", title:'Ивент "Пустые мечты" - #XL', author:"@xluniverse / xl universe - официальный канал", stats:"233 просмотров • 3 дня назад", thumbnail:"/Frame 1 (13).png", video:"video.mp4"}
];

// ==== Динамическая подстановка видео ====
const selectedVideoId = new URLSearchParams(window.location.search).get('v') || 'xl_announce';
const currentVideo = videos.find(v => v.id===selectedVideoId) || videos[0];

document.getElementById("videoTitle").textContent = currentVideo.title;
document.getElementById("videoStats").textContent = currentVideo.stats;
document.getElementById("channelName").textContent = currentVideo.author;
document.getElementById("mainVideo").poster = currentVideo.thumbnail;
document.getElementById("mainVideo").querySelector("source").src = currentVideo.video;
document.getElementById("mainVideo").load();

// ==== Рекомендации ====
const sidebar = document.getElementById("sidebar");
videos.forEach(v=>{
    if(v.id===currentVideo.id) return;
    const div = document.createElement("div");
    div.className="rec-card";
    div.innerHTML=`<img class="rec-thumb" src="${v.thumbnail}"/><div class="rec-info"><div class="rec-title">${v.title}</div><div class="rec-meta">${v.stats}</div></div>`;
    div.onclick = ()=>{ window.location.href=`watch.html?v=${v.id}`; };
    sidebar.appendChild(div);
});

// ==== Кастомный плеер ====
const video = document.getElementById("mainVideo");
const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");
const volumeSlider = document.getElementById("volume");
const volumeContainer = document.getElementById("volumeContainer");
const speedContainer = document.getElementById("speedContainer");
const speedOptions = document.getElementById("speedOptions");
const fullscreenBtn = document.getElementById("fullscreen");
const timeDisplay = document.getElementById("timeDisplay");

// Play/pause
playPause.onclick = ()=>{ video.paused? video.play() : video.pause(); updatePlayIcon(); }
video.onplay = video.onpause = updatePlayIcon;

// Прогресс
video.ontimeupdate = updateProgress;
progressContainer.onclick = e=>{
    const rect = progressContainer.getBoundingClientRect();
    const percent = (e.clientX-rect.left)/rect.width;
    video.currentTime = percent*video.duration;
};

// Громкость (клик по иконке)
volumeContainer.onclick = ()=>{
    volumeContainer.classList.toggle("active");
};
volumeSlider.oninput = e=> video.volume = e.target.value;

// Скорость
speedContainer.onclick = ()=>{ speedContainer.classList.toggle("active"); }
speedOptions.querySelectorAll("div").forEach(opt=>{
    opt.onclick = e=>{ video.playbackRate = opt.dataset.speed; speedContainer.classList.remove("active"); }
});

// Fullscreen
fullscreenBtn.onclick = ()=>{ 
    if(document.fullscreenElement) document.exitFullscreen(); 
    else document.getElementById("player").requestFullscreen();
};

// Update UI
function updateProgress(){
    const percent = (video.currentTime/video.duration)*100;
    progress.style.width = percent+"%";
    const format = t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
    timeDisplay.textContent = `${format(video.currentTime)} / ${format(video.duration)}`;
}
function updatePlayIcon(){
    playPause.innerHTML = video.paused? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
}
</script>
</body>
</html>
