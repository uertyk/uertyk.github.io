<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubeTube</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <style>
        :root {
            --primary-bg: #101116;
            --secondary-bg: #0d0d11;
            --accent-color: #6d6fff;
            --text-color: #c9d1d9;
            --search-bg: #111418;
            --border-color: #30363d;
            --tag-bg: #191d20;
            --tag-hover-bg: #151618;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--primary-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: var(--secondary-bg);
            padding: 15px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-container {
            position: relative;
            width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 10px 45px 10px 15px;
            border-radius: 20px;
            background-color: var(--search-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.7;
        }

        .avatar img {
            width: 50px;
            height: 50px;
            border-radius: 1%;
            object-fit: cover;
        }

        .tags {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 80px;
        }

        .tag {
            background-color: var(--tag-bg);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 14px;
            border: 1px solid var(--border-color);
        }

        .content-section {
            padding: 20px 80px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 40px;
        }

        .video-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .video-thumbnail {
            width: 100%;
            height: 150px;
            position: relative;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-duration {
            position: absolute;
            right: 8px;
            bottom: 8px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.6);
            font-size: 12px;
            border-radius: 6px;
        }

        .video-info { padding: 15px; }
        .video-title { font-weight: 700; font-size: 18px; color:#fff; }
        .video-details { opacity: 0.7; font-size:14px; }

        .burger-menu{
            display: none;
        }

        .main-menu{
            display: none;
        }

        @media (min-width: 0px) and (max-width: 700px){
            .burger-menu{
                display: block;
                width: 30px;
                height: 30px;
                background-image: url(images/menu.png);
                background-size: contain;
                background-repeat: no-repeat;
                position: absolute;
                left: calc(100% - 150px);
                z-index: 999;
            }

            .avatar{
                display: none;
            }

            .search-container{
                display: none;
            }

            .main-menu{
                display: block;
                position: absolute;
                width: 100%;
                height: 100vh;
                top: 0;
                left: 0;
                background-color: black;
                padding: 20px;
                transform: translate(1000px);
                transition: 2s;
            }
            .main-menu > ul{
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .main-menu > ul > li{
                margin-top: 20px;
                font-size: 30px;
            }

            .burger-menu.active{
                background-image: url(images/no.png);
            }

            .main-menu.active{
                transform: translate(0);
            }


        }
        .slick-slider{
            display: flex !important;
            align-items: center;

        }

        .carusel_item img{
        width: auto;
        height: 300px;
        }

        .carusel_item{
            display: flex !important;
            flex-direction: column;
            margin-right: 20px;
        }

        .active-tag {
            background-color: var(--accent-color);
            color: white;
        }

    </style>
</head>

<body>
